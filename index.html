<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TheStructuredStream</title>
    <style>
        body { font-family: sans-serif; background: #000; color: #fff; text-align: center; padding: 50px; }
        h1 { color: #fff; }
    </style>
    <header class="top-banner">
      <img src="images/TheStructuredStream.png" alt=" ">
    </header>
    <style>
                /* Removes default browser gaps at the top and sides of the page */
        body {
          margin: 0;
          padding: 0;
        }
        
        /* Forces the banner container to take up the full width */
        .top-banner {
          width: 100%;
          overflow: hidden;
        }
        
        /* Makes the banner image responsive and fluid */
        .top-banner img {
          width: 100%;
          height: auto;
          display: block; /* Eliminates a tiny default bottom gap under images */
        }

    </style>
</head>
<body>
    <h1>TheStructuredStream</h1>
    <p>Featuring Open Source Data Products SweetSpotIO and VerifiedBites.</p>
</body>
</html>
